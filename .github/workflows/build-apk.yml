name: build-apk

# Собирает APK по тегу v* и публикует релиз.
# Если настроены секреты подписи (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD) — собирается подписанный release-APK,
# иначе — debug-APK (апгрейд на подписанный release будет невозможен).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9 (проверка контрольной суммы)
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/gradle.zip.sha256 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256
          HASH="$(cut -d' ' -f1 /tmp/gradle.zip.sha256)"
          echo "$HASH  gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            CMDLINE="$(dirname "$(find "$SDK_ROOT" -name sdkmanager -type f -print -quit)")"
          fi
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "no sdkmanager under $SDK_ROOT" >&2
            ls "$SDK_ROOT" >&2
            exit 1
          fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Подготовить подпись для release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured — will build debug APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > clawd-release.keystore
          printf 'storeFile=clawd-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build APK
        run: |
          if [ -f keystore.properties ]; then
            gradle :app:assembleRelease --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload release APK (если собран)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload debug APK (если собран)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          APK="$(ls *.apk | head -n 1)"
          echo "Publishing $APK"
          if gh release view "${GITHUB_REF_NAME}" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber --repo "$REPO"
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" --repo "$REPO" \
              --title "Clawd for Android ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
