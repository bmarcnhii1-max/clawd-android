name: build-apk

# Builds the debug APK on every v* tag and publishes it as a GitHub release.
#
# Only GitHub-owned actions are used (actions/*). Gradle and the Android SDK
# are installed with plain shell steps, so no third-party action repository
# is trusted by this workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          # The Android SDK ships preinstalled on GitHub runners, but its
          # cmdline-tools are not on PATH by default.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "cmdline-tools not found under $SDK_ROOT" >&2
            ls "$SDK_ROOT" >&2
            exit 1
          fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app-debug.apk \
            --title "Clawd for Android ${GITHUB_REF_NAME}" \
            --generate-notes
